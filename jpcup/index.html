<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>JP Cup</title>
  <meta name="description" content="JP Cup doubles knockout pool tournament.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner wrap">
      <p class="eyebrow">Doubles knockout · 22 players · 11 teams</p>
      <h1>
        <span class="ball eight" aria-hidden="true"></span>
        JP Cup
        <span class="ball cue" aria-hidden="true"></span>
      </h1>
      <p class="status" id="status">Waiting for the hat draw.</p>
    </div>
  </header>

  <nav class="jump" aria-label="On this page">
    <div class="jump-inner wrap">
      <a href="#teams">Teams</a>
      <a href="#round1">Round 1</a>
      <a href="#quarters">Quarters</a>
      <a href="#semis">Semis</a>
      <a href="#final">Final</a>
    </div>
  </nav>

  <main class="wrap">
    <section id="teams">
      <h2>Teams</h2>
      <p class="sec-note" id="players-label">The 22 players</p>
      <ul class="players" id="players"></ul>
      <ol class="teams" id="team-list"></ol>
    </section>

    <section id="round1">
      <h2>Round 1</h2>
      <p class="sec-note" id="bye-note"></p>
      <div class="matches" id="round1-matches"></div>
    </section>

    <section id="quarters">
      <h2>Quarter-finals</h2>
      <div class="matches" id="qf-matches"></div>
    </section>

    <section id="semis">
      <h2>Semi-finals</h2>
      <div class="matches" id="sf-matches"></div>
    </section>

    <section id="final">
      <h2>Final</h2>
      <div class="matches" id="final-match"></div>

      <div class="champions" id="champions">
        <h2>Champions</h2>
        <p class="champ-name" id="champ-name">Winner of the final appears here</p>
      </div>
    </section>
  </main>

  <p class="updated wrap" id="updated"></p>

  <div id="celebration" class="celebration" hidden aria-hidden="true"></div>

  <script type="module" src="page.js"></script>
</body>
</html>
